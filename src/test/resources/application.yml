spring:
  datasource:
    url: jdbc:h2:mem:book-library-sokol
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:/schema.sql
      data-locations: classpath:/data.sql
      mode: always
server:
  servlet:
    context-path: /book-library